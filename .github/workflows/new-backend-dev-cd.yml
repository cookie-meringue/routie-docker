name: Backend CD on develop branch

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend/spring-routie

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          recursive: true
          token: ${{ secrets.PAT_FOR_SUBMODULE }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: BootJar with Gradle
        run: ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_APPLICATION_IMAGE_NAME: ${{secrets.DOCKER_APPLICATION_IMAGE_NAME}}
          TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE_NAME=$DOCKER_USERNAME/$DOCKER_APPLICATION_IMAGE_NAME
          docker build --platform linux/arm64 -t $FULL_IMAGE_NAME:$TAG -t $FULL_IMAGE_NAME:latest .
          docker push $FULL_IMAGE_NAME:$TAG
          docker push $FULL_IMAGE_NAME:latest

      # 9. 배포 패키지(Zip) 만들기
      - name: Prepare Deployment Package
        run: |
          DEPLOY_DIR=$GITHUB_WORKSPACE/deployment
          
          mkdir -p $DEPLOY_DIR/migration
          cp -r src/main/resources/db/migration/* $DEPLOY_DIR/migration/
          
          pwd
          cp -r ./routie-docker-submodule/dev/. $DEPLOY_DIR/
          
          sed -i "s/\${TAG}/${{ github.sha }}/g" $DEPLOY_DIR/docker-compose.yml
          
          cd "$DEPLOY_DIR"
          zip -r "$GITHUB_WORKSPACE/deploy.zip" .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Upload Config to S3
        run: |
          aws s3 cp $GITHUB_WORKSPACE/deploy.zip s3://routie-docker-test/deployments/${{ github.sha }}/deploy.zip

